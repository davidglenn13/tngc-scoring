name: TNGC V2 CI

on:
  push:
    branches: [v2-platform-rebuild]
  pull_request:
    branches: [main]

jobs:
  v2-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:v2
