name: TNGC V2 CI

on:
  push:
    branches: [v2-platform-rebuild]
  pull_request:
    branches: [main]

jobs:
  v2-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:v2

  deploy-beta:
    if: github.event_name == 'push'
    needs: v2-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy isolated TNGC beta to Cloudflare Pages
        run: >-
          npx --yes wrangler@latest pages deploy .
          --project-name=tngc-scoring-v2-beta
          --branch=v2-platform-rebuild
          --commit-message="TNGC beta6 Ballyhack layout and private 40 Ball"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
